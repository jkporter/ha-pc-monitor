name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(grep -oP '(?<=<Version>)[^<]+' src/HassHwStats/HassHwStats.csproj)
            echo "version=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Start MQTT broker for the integration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          mosquitto -d -p 1883

      - name: Test
        run: dotnet test tests/HassHwStats.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish win-x64
        run: >
          dotnet publish src/HassHwStats -c Release -o publish/win-x64
          -p:Version=${{ steps.version.outputs.version }} -p:DebugType=none

      - name: Package
        id: package
        shell: bash
        run: |
          cp install.ps1 uninstall.ps1 README.md dashboard-example.yaml publish/win-x64/
          name="HassHwStats-${{ steps.version.outputs.version }}-win-x64.zip"
          (cd publish/win-x64 && zip -qr9 "../$name" .)
          echo "zip=publish/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: HassHwStats-${{ steps.version.outputs.version }}-win-x64
          path: publish/win-x64/
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}"
          --title "HassHwStats $GITHUB_REF_NAME" --generate-notes
