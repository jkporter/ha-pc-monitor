# Sample generated by HassHwStats for a PC named JKP-Gaming. Your own PC writes dashboard.yaml next to the exe.
title: "JKP-Gaming"
views:
  - title: Overview
    path: overview
    icon: mdi:monitor-dashboard
    cards:
      - type: glance
        title: Now playing
        entities:
          - entity: sensor.jkp_gaming_frame_rate
            name: "Frame rate"
      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.jkp_gaming_cpu_cpu_total_load
            name: "CPU load"
            min: 0
            max: 100
          - type: gauge
            entity: sensor.jkp_gaming_gpu_gpu_core_load
            name: "GPU load"
            min: 0
            max: 100
          - type: gauge
            entity: sensor.wireview_pro_ii_power
            name: "12V-2x6 power"
            min: 0
            max: 600
            severity: { green: 0, yellow: 450, red: 550 }
      - type: entities
        title: "GPU"
        entities:
          - entity: sensor.jkp_gaming_gpu_gpu_core_load
            name: "GPU Core load"
          - entity: sensor.jkp_gaming_gpu_gpu_core_temperature
            name: "GPU Core temperature"
      - type: entities
        title: "CPU"
        entities:
          - entity: sensor.jkp_gaming_cpu_cpu_total_load
            name: "CPU Total load"
  - title: CPU cores
    path: cpu-cores
    icon: mdi:cpu-64-bit
    cards:
      - type: entities
        title: "Core load"
        state_color: true
        entities:
          - entity: sensor.jkp_gaming_cpu_cpu_core_1_load
            name: "Core #1"
          - entity: sensor.jkp_gaming_cpu_cpu_core_2_load
            name: "Core #2"
          - entity: sensor.jkp_gaming_cpu_cpu_core_3_load
            name: "Core #3"
          - entity: sensor.jkp_gaming_cpu_cpu_core_4_load
            name: "Core #4"
          - entity: sensor.jkp_gaming_cpu_cpu_core_5_load
            name: "Core #5"
          - entity: sensor.jkp_gaming_cpu_cpu_core_6_load
            name: "Core #6"
          - entity: sensor.jkp_gaming_cpu_cpu_core_7_load
            name: "Core #7"
          - entity: sensor.jkp_gaming_cpu_cpu_core_8_load
            name: "Core #8"
          - entity: sensor.jkp_gaming_cpu_cpu_core_9_load
            name: "Core #9"
          - entity: sensor.jkp_gaming_cpu_cpu_core_10_load
            name: "Core #10"
      - type: entities
        title: "Core clock"
        state_color: true
        entities:
          - entity: sensor.jkp_gaming_cpu_core_1_clock
            name: "Core #1"
          - entity: sensor.jkp_gaming_cpu_core_2_clock
            name: "Core #2"
          - entity: sensor.jkp_gaming_cpu_core_3_clock
            name: "Core #3"
          - entity: sensor.jkp_gaming_cpu_core_4_clock
            name: "Core #4"
          - entity: sensor.jkp_gaming_cpu_core_5_clock
            name: "Core #5"
          - entity: sensor.jkp_gaming_cpu_core_6_clock
            name: "Core #6"
          - entity: sensor.jkp_gaming_cpu_core_7_clock
            name: "Core #7"
          - entity: sensor.jkp_gaming_cpu_core_8_clock
            name: "Core #8"
          - entity: sensor.jkp_gaming_cpu_core_9_clock
            name: "Core #9"
          - entity: sensor.jkp_gaming_cpu_core_10_clock
            name: "Core #10"
      - type: history-graph
        title: "Core clocks, last hour"
        hours_to_show: 1
        entities:
          - sensor.jkp_gaming_cpu_core_1_clock
          - sensor.jkp_gaming_cpu_core_2_clock
          - sensor.jkp_gaming_cpu_core_3_clock
          - sensor.jkp_gaming_cpu_core_4_clock
          - sensor.jkp_gaming_cpu_core_5_clock
          - sensor.jkp_gaming_cpu_core_6_clock
          - sensor.jkp_gaming_cpu_core_7_clock
          - sensor.jkp_gaming_cpu_core_8_clock
          - sensor.jkp_gaming_cpu_core_9_clock
          - sensor.jkp_gaming_cpu_core_10_clock
      - type: history-graph
        title: "Core load, last hour"
        hours_to_show: 1
        entities:
          - sensor.jkp_gaming_cpu_cpu_core_1_load
          - sensor.jkp_gaming_cpu_cpu_core_2_load
          - sensor.jkp_gaming_cpu_cpu_core_3_load
          - sensor.jkp_gaming_cpu_cpu_core_4_load
          - sensor.jkp_gaming_cpu_cpu_core_5_load
          - sensor.jkp_gaming_cpu_cpu_core_6_load
          - sensor.jkp_gaming_cpu_cpu_core_7_load
          - sensor.jkp_gaming_cpu_cpu_core_8_load
          - sensor.jkp_gaming_cpu_cpu_core_9_load
          - sensor.jkp_gaming_cpu_cpu_core_10_load
  - title: WireView
    path: wireview
    icon: mdi:power-plug
    cards:
      - type: entities
        title: "WireView Pro II"
        entities:
          - entity: sensor.wireview_pro_ii_status
            name: "Status"
          - entity: binary_sensor.wireview_pro_ii_connected
            name: "Connected"
          - entity: sensor.wireview_pro_ii_power
            name: "Power"
          - entity: sensor.wireview_pro_ii_current
            name: "Current"
          - entity: sensor.wireview_pro_ii_voltage
            name: "Voltage"
          - entity: sensor.wireview_pro_ii_connector_input_temperature
            name: "Connector input temperature"
          - entity: sensor.wireview_pro_ii_connector_output_temperature
            name: "Connector output temperature"
          - entity: sensor.wireview_pro_ii_external_temperature_1
            name: "External temperature 1"
          - entity: sensor.wireview_pro_ii_external_temperature_2
            name: "External temperature 2"
          - entity: sensor.wireview_pro_ii_fan
            name: "Fan"
          - entity: sensor.wireview_pro_ii_cable_rating
            name: "Cable rating"
          - entity: sensor.wireview_pro_ii_highest_pin_current
            name: "Highest pin current"
          - entity: sensor.wireview_pro_ii_current_imbalance
            name: "Current imbalance"
          - entity: binary_sensor.wireview_pro_ii_fault
            name: "Fault"
          - entity: sensor.wireview_pro_ii_active_faults
            name: "Active faults"
          - entity: sensor.wireview_pro_ii_logged_faults
            name: "Logged faults"
      - type: grid
        title: Pin current
        columns: 3
        square: false
        cards:
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_1_current, name: "Pin 1", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_2_current, name: "Pin 2", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_3_current, name: "Pin 3", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_4_current, name: "Pin 4", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_5_current, name: "Pin 5", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
          - { type: gauge, entity: sensor.wireview_pro_ii_pin_6_current, name: "Pin 6", min: 0, max: 10, severity: { green: 0, yellow: 8, red: 9.2 } }
      - type: history-graph
        title: Last 2 hours
        hours_to_show: 2
        entities:
          - sensor.wireview_pro_ii_power
          - sensor.wireview_pro_ii_highest_pin_current
          - sensor.wireview_pro_ii_current_imbalance
          - sensor.wireview_pro_ii_connector_output_temperature
